name: Build & Package Atlas

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build cdylib for Android with cargo-ndk
        run: cargo ndk -t arm64-v8a --release build --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Prepare release package
        run: |
          # Crear la estructura de carpetas idéntica a la de Starling
          mkdir -p package/horizon-mods/atlas
          mkdir -p package/horizon-native-mods

          # Copiar el manifiesto
          cp mod.toml package/horizon-mods/atlas/mod.toml

          # Copiar dinámicamente la librería .so generada por cargo-ndk para Android
          cp target/aarch64-linux-android/release/*.so package/horizon-native-mods/libatlas.so

          # Comprimir todo en un ZIP listo para usar
          cd package
          zip -r ../atlas-starling-release.zip *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-starling-release
          path: atlas-starling-release.zip
