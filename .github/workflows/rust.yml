name: Build & Package Atlas

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: aarch64-linux-android

      # Recomendado: Añadir caché para acelerar futuras compilaciones
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # Optimización: Instalar cargo-ndk usando un action precompilado es más rápido que hacer cargo install
      - name: Install cargo-ndk
        uses: taiki-e/install-action@cargo-ndk

      - name: Build cdylib for Android with cargo-ndk
        # CORREGIDO: --release va después de build
        run: cargo ndk -t arm64-v8a build --release --verbose

      - name: Run tests
        # Nota: Esto correrá los tests en la arquitectura del host (Linux x86_64)
        run: cargo test --verbose

      - name: Prepare release package
        run: |
          # Crear la estructura de carpetas idéntica a la de Starling
          mkdir -p package/horizon-mods/atlas
          mkdir -p package/horizon-native-mods

          # Copiar el manifiesto
          cp mod.toml package/horizon-mods/atlas/mod.toml

          # Copiar dinámicamente la librería .so generada. 
          # Es mejor especificar el nombre real de tu librería (según tu log, es libhorizon_atlas.so)
          cp target/aarch64-linux-android/release/libhorizon_atlas.so package/horizon-native-mods/libatlas.so

          # Comprimir todo en un ZIP listo para usar
          cd package
          zip -r ../atlas-starling-release.zip *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-starling-release
          path: atlas-starling-release.zip
