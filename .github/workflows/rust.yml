name: Build & Package Atlas

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build cdylib for Android with cargo-ndk
        run: cargo ndk -t arm64-v8a build --release --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Prepare release package
        run: |
          mkdir -p package/horizon-mods/atlas
          mkdir -p package/horizon-native-mods
          cp mod.toml package/horizon-mods/atlas/mod.toml
          cp target/aarch64-linux-android/release/*.so package/horizon-native-mods/libatlas.so
          cd package
          zip -r ../atlas-release.zip *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-release
          path: atlas-release.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          body: "Native (arm64-v8a) binaries for Atlas and Minimap compiled for Starling, packaged and ready to load in the launcher."
          files: |
            atlas-release.zip
            target/aarch64-linux-android/release/*.so
